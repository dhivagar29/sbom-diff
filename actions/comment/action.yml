name: sbom-diff-comment
description: Validate an sbom-diff JSON artifact and post or update a sticky PR comment. Never checks out PR code. Never trusts the PR number from the artifact.
author: dhivagar29
branding:
  icon: message-square
  color: blue
inputs:
  artifact-path:
    description: Path to the downloaded sbom-diff JSON artifact
    required: true
  repository:
    description: owner/repo of the base repository that received the PR
    required: false
    default: ${{ github.repository }}
  trusted-head-sha:
    description: Trusted head SHA from github.event.workflow_run.head_sha (required)
    required: true
  head-owner:
    description: Optional head repo owner (workflow_run.head_repository.owner.login) for fork matching
    required: false
    default: ''
  head-repo:
    description: Optional head repo name (workflow_run.head_repository.name) for fork matching
    required: false
    default: ''
  github-token:
    description: Token with pull-requests:write
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up Node 20
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: '20'
    - name: Post sticky comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        SBOM_DIFF_ARTIFACT: ${{ inputs.artifact-path }}
        SBOM_DIFF_TRUSTED_HEAD_SHA: ${{ inputs.trusted-head-sha }}
        SBOM_DIFF_HEAD_OWNER: ${{ inputs.head-owner }}
        SBOM_DIFF_HEAD_REPO: ${{ inputs.head-repo }}
        ACTION_ROOT: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        ROOT="$(cd "$ACTION_ROOT" && pwd)"
        node "$ROOT/src/comment.js"
