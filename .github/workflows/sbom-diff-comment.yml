# Workflow B — comment. Runs on workflow_run after Workflow A completes.
# permissions: pull-requests: write, actions: read.
# NEVER checks out or executes the PR's code. Treats the artifact as untrusted.
# NEVER trusts artifact.meta.pullRequestNumber — resolves the PR from
# workflow_run.head_sha via the GitHub API after rejecting SHA mismatches.
name: sbom-diff-comment
on:
  workflow_run:
    workflows: ["sbom-diff"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sbom-diff-json
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      # Checkout the default branch only (trusted). Never the PR head.
      - name: Checkout trusted commenter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: sbom-diff
          persist-credentials: false

      - name: Post sticky comment
        uses: ./sbom-diff/actions/comment
        with:
          artifact-path: ./artifact/sbom-diff.json
          repository: ${{ github.repository }}
          trusted-head-sha: ${{ github.event.workflow_run.head_sha }}
          head-owner: ${{ github.event.workflow_run.head_repository.owner.login }}
          head-repo: ${{ github.event.workflow_run.head_repository.name }}
          head-branch: ${{ github.event.workflow_run.head_branch }}
